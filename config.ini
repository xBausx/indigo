[Paths]
# This is the full, absolute path to the InDesign executable
indesign_executable = C:/Program Files/Adobe/Adobe InDesign 2025/InDesign.exe

# Absolute path for the final resized output, sent to the static flyers repository.
# This path is used by resizeall.jsx and the Python completion check.
final_flyers_output_folder = C:/Users/Admin/Documents/nctv-repositories/html-flyers-static/flyers

# This is the folder name inside AppData that corresponds to your InDesign version
indesign_version_folder = Version 20.0

# These paths are relative to the project root
input_folder = 1_Input_Files
output_folder = 2_Output_HTML
processed_folder = 3_Processed_Files
scripts_folder = 4_Scripts
error_folder = 5_Error_Files
log_folder = 6_Logs
detailed_log_folder = 7_Detailed_Logs
image_assets_folder = 8_Images

[Settings]
max_retries = 3
retry_delay_seconds = 10
process_timeout = 1800
initial_launch_wait = 10
inter_action_wait = 5
process_wait = 15

[ImageFiles]
# Names of the image files located in the image_assets_folder
export_button = export_button.png
skip_fonts_button = skip_fonts_button.png
cancel_recover_button = cancel_recover_button.png
no_button = no_button.png
ok_button = ok_button.png
user_scripts_folder = user_scripts_folder.png
resize_all_script = resize_all_script.png
signal_ok_button = signal_ok_button.png

[SignalFiles]
# The name of the file used by the resize script to signal completion
resize_complete_signal = resize_complete.txt

[Callback]
# The URL to call after a file is successfully resized.
url = http://localhost:3000/api/checkup/deploy-changes